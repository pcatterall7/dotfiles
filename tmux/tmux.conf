set -s escape-time 5

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix
setw -g mode-keys vi
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Prevent tmux from overwriting window names with the running command
set -g automatic-rename off

# Status bar colors live in tmux-dark.conf / tmux-light.conf and are switched
# automatically with the macOS appearance by tmux-dark-notify (needs the
# dark-notify binary: brew install cormacrelf/tap/dark-notify)
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}%H:%M %d-%b-%y"
set -g window-status-current-format '#I #W#[fg=#1abc9c]#F'
set -g window-status-format '#I #W '

# Make it easier to reload my tmux config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Pipe tmux buffer to system clipboard (supports only mac)
if-shell "uname | grep -q Darwin" \
    "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy' \\; display \"Copied\"; \
     bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'"

# Shift-enter for claude code
bind-key -T root S-Enter send-keys C-j

# Fix colors to support 
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Shift-enter passthrough for claude code
set -as terminal-features 'xterm*:extkeys'

# Start from the last theme tmux-dark-notify applied (so reloading the config
# doesn't flip the colors), falling back to dark so the status bar is never
# tmux's stock green. The plugin below keeps it in sync with the system.
if-shell "test -r ~/.local/state/tmux/tmux-dark-notify-theme.conf" \
    "source-file ~/.local/state/tmux/tmux-dark-notify-theme.conf" \
    "source-file -q ~/.tmux/tmux-dark.conf"

# Plugins (tpm is cloned on first run; install plugins with prefix + I)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'erikw/tmux-dark-notify'
set -g @dark-notify-theme-path-light '~/.tmux/tmux-light.conf'
set -g @dark-notify-theme-path-dark '~/.tmux/tmux-dark.conf'

if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"
run '~/.tmux/plugins/tpm/tpm'
